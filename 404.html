  <script>
    (function () {
      var root = document.documentElement;
      var lang = 'ar';
      var theme = 'light';
      try {
        if (localStorage.getItem('lux-lang') === 'en') { lang = 'en'; }
        var savedTheme = localStorage.getItem('lux-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme;
        }
      } catch (e) {  }
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      root.setAttribute('data-bs-theme', theme);
      if (lang === 'en') {
        var bootstrapLink = document.getElementById('bootstrap-css');

        if (bootstrapLink) {
          bootstrapLink.setAttribute(
            'href',
            'vendor/bootstrap/bootstrap.min.css'
          );
        }
      }
    })();
  </script>
