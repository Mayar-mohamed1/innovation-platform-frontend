<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Luxor Innovation Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/images/luxor-uni-logo.png">

  <!-- arabic font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <!-- for ltr in eng -->
  <link id="bootstrap-css"
        rel="stylesheet"
        href="vendor/bootstrap/bootstrap.rtl.min.css"
        data-beasties-skip>

  
  <script>
    (function () {
      var root = document.documentElement;
      var lang = 'ar';
      var theme = 'light';
      try {
        if (localStorage.getItem('lux-lang') === 'en') { lang = 'en'; }
        var savedTheme = localStorage.getItem('lux-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme;
        }
      } catch (e) {  }
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      root.setAttribute('data-bs-theme', theme);
      if (lang === 'en') {
        var bootstrapLink = document.getElementById('bootstrap-css');

        if (bootstrapLink) {
          bootstrapLink.setAttribute(
            'href',
            'vendor/bootstrap/bootstrap.min.css'
          );
        }
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
