<div class="container d-flex justify-content-center align-items-center py-5">
  <div class="card shadow-lg p-5 border w-100" style="max-width: 680px; background-color: var(--lux-surface); border-color: var(--lux-border) !important;">

    
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="bg-white rounded p-1 d-flex align-items-center justify-content-center shadow-sm" style="width: 130px; height: 130px;">
        <img src="assets/images/luxor-uni-logo.png" alt="Luxor University Logo" class="img-fluid" style="max-height: 150px; object-fit: contain;">
      </div>
      <div>
        <span class="badge px-3 py-1 fw-bold mb-1" style="background-color: var(--lux-primary-soft); color: var(--lux-primary);">
          Secure workspace
        </span>
        <h2 class="fw-bold mb-0 " style="color: var(--lux-heading);">Sign in to your workspace</h2>
      </div>
    </div>

    <p class="mb-4 small" style="color: var(--lux-muted);">Choose your account type to continue.</p>

   

    
    <div routerLink="/login-researcher-company" class="card p-3 mb-3 border cursor-pointer transition-hover" style="background-color: rgba(255, 255, 255, 0.02); border-color: var(--lux-border) !important; cursor: pointer;">
      <div class="d-flex align-items-center gap-3">
        <div class="fs-4 text-primary"><i class="fa-solid fa-lightbulb"></i></div>
        <div>
          <h6 class="fw-bold mb-1" style="color: var(--lux-heading);">Researcher</h6>
          <p class="small mb-0" style="color: var(--lux-muted);">Demo workspace</p>
        </div>
      </div>
    </div>

   
    <div routerLink="/login-researcher-company" class="card p-3 mb-3 border cursor-pointer transition-hover" style="background-color: rgba(255, 255, 255, 0.02); border-color: var(--lux-border) !important; cursor: pointer;">
      <div class="d-flex align-items-center gap-3">
        <div class="fs-4 text-primary"><i class="fa-solid fa-bullseye"></i></div>
        <div>
          <h6 class="fw-bold mb-1" style="color: var(--lux-heading);">Company representative</h6>
          <p class="small mb-0" style="color: var(--lux-muted);">Demo workspace</p>
        </div>
      </div>
    </div>

 
    <div routerLink="/login-judge" class="card p-3 mb-3 border cursor-pointer transition-hover" style="background-color: rgba(255, 255, 255, 0.02); border-color: var(--lux-border) !important; cursor: pointer;">
      <div class="d-flex align-items-center gap-3">
        <div class="fs-4 text-primary"><i class="fa-solid fa-eye"></i></div>
        <div>
          <h6 class="fw-bold mb-1" style="color: var(--lux-heading);">Judge / Reviewer</h6>
          <p class="small mb-0" style="color: var(--lux-muted);">Open judge sign-in page</p>
        </div>
      </div>
    </div>

   
    <div routerLink="/login-admin" class="card p-3 mb-4 border cursor-pointer transition-hover" style="background-color: rgba(255, 255, 255, 0.02); border-color: var(--lux-border) !important; cursor: pointer;">
      <div class="d-flex align-items-center gap-3">
        <div class="fs-4 text-primary"><i class="fa-solid fa-lock"></i></div>
        <div>
          <h6 class="fw-bold mb-1" style="color: var(--lux-heading);">Administrator</h6>
          <p class="small mb-0" style="color: var(--lux-muted);">Open admin sign-in page</p>
        </div>
      </div>
    </div>

 
    <div class="text-center small" style="color: var(--lux-muted);">
      New researcher or company?
      <a routerLink="/register-options" class="fw-bold text-decoration-underline" style="color: var(--lux-primary);">Create an account</a>
    </div>

  </div>
</div>
