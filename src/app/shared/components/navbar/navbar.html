<nav class="navbar navbar-expand-lg lux-navbar px-4 py-3">
  <div class="container-fluid">

   
    <a class="navbar-brand d-flex align-items-center gap-3" routerLink="/">
      <!-- صورة الشعار -->
      <div class="d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
        <img src="assets/images/luxor-uni-logo.png" alt="Luxor University Logo" class="img-fluid w-100 h-100" style="object-fit: contain;">
      </div>

      <!-- العنوان الرئيسي والفرعي تحته وقابلين للترجمة -->
      <div class="d-flex flex-column">
        <span class="fw-bold text-white" style="font-size: 0.95rem; line-height: 1.2;">{{ 'nav.platformTitle' | translate }}</span>
        <span class="text-white-50" style="font-size: 0.75rem;">{{ 'nav.platformSubtitle' | translate }}</span>
      </div>
    </a>

  
    <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="fa-solid fa-bars"></i>
    </button>

   
    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-3 align-items-center">
        <li class="nav-item">
          <a class="nav-link text-white active" routerLink="/"><i class="fa-solid fa-house ms-1"></i> {{ 'nav.home' | translate }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50" routerLink="/innovations"><i class="fa-solid fa-lightbulb ms-1"></i> {{ 'nav.innovations' | translate }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50" routerLink="/challenges"><i class="fa-solid fa-bullseye ms-1"></i> {{ 'nav.challenges' | translate }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50" routerLink="/login-options"><i class="fa-solid fa-right-to-bracket ms-1"></i> {{ 'nav.login' | translate }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50" routerLink="/register-options"><i class="fa-solid fa-user-plus ms-1"></i> {{ 'nav.register' | translate }}</a>
        </li>
      </ul>

     
      <div class="d-flex align-items-center gap-3">
        <!--temporary only while dev---> 
        <div class="dropdown">
          <select class="form-select form-select-sm bg-light text-dark fw-bold border-0 px-3 py-2"
                  [value]="userRole"
                  (change)="onRoleChange($event)">
            <option value="visitor">عرض كـ: زائر</option>
            <option value="researcher">عرض كـ: باحث</option>
            <option value="company">عرض كـ: شركة</option>

          <i class="fa-solid fa-sun"></i> {{ 'theme.light' | translate }}
          } @else {
          <i class="fa-solid fa-moon"></i> {{ 'theme.dark' | translate }}
          }
        </button>


        <button class="btn btn-sm btn-outline-light" (click)="language.toggle()">
          <i class="fa-solid fa-globe"></i> {{ language.language() === 'ar' ? 'English' : 'العربية' }}
        </button>
      </div>

    </div>
